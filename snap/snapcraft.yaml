name: xbtune
adopt-info: xbtune
title: XBTune
summary: Diagnostics, logging and tuning for Buell DDFI motorcycles
description: |
  XBTune reads, logs and tunes Buell DDFI ECMs: the 2003-2009 XB9 and XB12
  (DDFI-2, DDFI-3), the 1999-2002 tube-frame bikes (DDFI) and factory race
  ECMs, over Bluetooth (BuellTooth and other SPP adapters) or a USB serial
  cable.

  Free and open source: no price, no ads, no account. It identifies the
  ECM, reads and saves the EEPROM, shows and logs live data (with an
  optional Innovate LC-2 wideband), reads trouble codes and runs tests,
  edits tunes offline, auto-tunes the fuel maps from your logs, and writes
  tunes to the ECM. Remote tuning lets a tuner work on your tune over the
  internet, end-to-end encrypted, with only the permissions you give.
  Tests, resets and writing to the ECM are locked until you unlock them in
  Settings; every write makes a verified backup first and is read back.

  WARNING: a bad tune can damage your engine. Check every change before
  writing it. XBTune comes with no warranty (GPL-3.0); you are responsible
  for what you write to your ECM.

  After installing, connect the interfaces it needs:

    sudo snap connect xbtune:bluez
    sudo snap connect xbtune:raw-usb
    sudo snap connect xbtune:removable-media

  Then open XBTune from the app menu, or try the command line:

    xbtune.cli doctor
    xbtune.cli scan
    xbtune.cli info --bt 00:11:22:AA:BB:CC
    xbtune.cli info --serial /dev/ttyUSB0

base: core24
grade: stable
confinement: strict
license: GPL-3.0-or-later
contact: https://github.com/kz6fittycent/XBTune/issues
issues: https://github.com/kz6fittycent/XBTune/issues
source-code: https://github.com/kz6fittycent/XBTune
website: https://github.com/kz6fittycent/XBTune/wiki

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  xbtune:
    command: bin/xbtune
    extensions: [gnome]
    plugs:
      - bluez
      - raw-usb
      - home
      - removable-media
      # Report a problem (one HTTPS POST to the bug-report relay) and
      # remote tuning (a WebSocket to the remote relay).
      - network
  cli:
    command: bin/xbtune-cli
    plugs:
      - bluez
      - raw-usb
      - home
      - removable-media
      # remote host/join; `remote relay` listens on a local port.
      - network
      - network-bind
  sim:
    command: bin/xbtune-sim
    plugs:
      - home

parts:
  # The gnome extension exports LD_LIBRARY_PATH/PKG_CONFIG_PATH into every
  # part's build environment, and the SDK's libc there breaks host tools
  # (rustup, cargo, rustc). The rust plugin can't opt out, so both parts
  # build with plain scripts that clear those variables. Ubuntu's rustup deb
  # is used because snapd 2.76 won't run the rustup snap as root in the
  # build instance.
  rust-deps:
    plugin: nil
    build-packages:
      - rustup
    override-build: |
      unset LD_LIBRARY_PATH PKG_CONFIG_PATH PYTHONPATH
      # The deb's rustup exits 1 after installing ("rustup is not installed
      # at ~/.cargo": it isn't, it's in /usr/bin), so check the result instead.
      /usr/bin/rustup toolchain install stable --profile minimal || true
      /usr/bin/rustup run stable cargo --version

  xbtune:
    plugin: nil
    # git, not a plain copy: only committed files go in, so the snap matches
    # a commit and the host's target/ (tens of GB of cargo output) stays
    # out of the build instance (it filled the root disk, 2026-10-25).
    source: .
    source-type: git
    after: [rust-deps]
    build-packages:
      - pkg-config
      - libdbus-1-dev
      - libudev-dev
      # Wayland title bar (winit/sctk-adwaita via crossfont). Without them
      # freetype-sys silently builds its bundled FreeType instead of linking
      # the system one (the gnome extension's runtime provides both libs).
      - libfreetype-dev
      - libfontconfig-dev
    stage-packages:
      - libdbus-1-3
      - libudev1
    override-pull: |
      craftctl default
      version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      # Plain 0.x.y (tools/bump_version.sh), no git suffix (owner, 2026-10-22).
      craftctl set version="${version}"
    override-build: |
      unset LD_LIBRARY_PATH PKG_CONFIG_PATH PYTHONPATH
      cargo() { /usr/bin/rustup run stable cargo "$@"; }
      cargo --version
      for crate in xbtune-app xbtune-cli xbtune-sim; do
        cargo install --locked --path "crates/${crate}" --root "${CRAFT_PART_INSTALL}"
      done
      rm -f "${CRAFT_PART_INSTALL}/.crates.toml" "${CRAFT_PART_INSTALL}/.crates2.json"
