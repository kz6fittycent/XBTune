name: 🛡️ Security Rebuild

# Once a day, runs the Snap Store's own security check
# (review-tools.snap-check-notices - the same check behind the store's
# "a rebuild would fix this" emails) against the snap published on stable.
# When Ubuntu has published fixes for packages bundled in it, this:
#
# 1. rebuilds the snap from the exact commit that released that version -
#    never from main, which may hold unreleased work;
# 2. checks the new build, and uploads it to the candidate channel;
# 3. opens a call-for-testing issue (labels: call-for-testing,
#    security-rebuild) listing the notices it fixes. Release it with the
#    usual "/promote <revision> stable done" comment (promote-to-stable.yml).
#
# Nothing happens while a security-rebuild issue is still open, so an
# unreleased rebuild isn't rebuilt again every day.
#
# Run it by hand from the Actions tab (Run workflow):
# - dry_run: checks and reports, but builds, uploads, and opens nothing
# - force: rebuilds even if there are no notices (to test the pipeline)

on:
  schedule:
    - cron: "17 9 * * *"  # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check and report - don't build, upload, or open an issue"
        type: boolean
        default: true
      force:
        description: "Rebuild even if there are no security notices"
        type: boolean
        default: false

# Store publishing is OFF until the repo may go public (docs/KICKOFF.md
# section 2, and ecmdroid.db licensing in docs/PROVENANCE.md). Set the
# repository variable XBTUNE_STORE_PUBLISH=true to turn it on.
permissions:
  contents: read

concurrency:
  group: security-rebuild
  cancel-in-progress: false

env:
  SNAP_NAME: xbtune

jobs:
  check:
    if: vars.XBTUNE_STORE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
      version: ${{ steps.stable.outputs.version }}
      stable_revision: ${{ steps.stable.outputs.revision }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout (full history, to find the release commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install review-tools
        run: |
          # Retried: the Snap Store's CDN has had transient failures.
          for attempt in 1 2 3; do
            sudo snap install review-tools && break
            [[ "$attempt" == 3 ]] && { echo "::error::snap install review-tools failed"; exit 1; }
            sleep 30
          done

      - name: Download the stable snap
        id: stable
        run: |
          snap download "$SNAP_NAME" --channel=stable --basename=stable
          version="$(unsquashfs -cat stable.snap meta/snap.yaml | sed -n 's/^version: *//p' | tr -d "'\"")"
          revision="$(snap info "$SNAP_NAME" | sed -n 's#^ *latest/stable: *[^ ]* *[^ ]* *(\([0-9]*\)).*#\1#p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Stable: version $version, revision $revision"

      - name: Check for security notices
        run: |
          review-tools.snap-check-notices stable.snap | tee notices-raw.json
          # {"<snap>": {"<revision>": {"<package>": ["USN-...", ...]}}} - empty when none.
          python3 - <<'EOF'
          import json
          raw = json.load(open("notices-raw.json"))
          notices = next(iter(next(iter(raw.values())).values()), {}) if raw else {}
          json.dump(notices, open("notices.json", "w"), indent=2, sort_keys=True)
          print(f"{sum(len(v) for v in notices.values())} notice(s) across {len(notices)} package(s)")
          EOF

      - name: Find the commit that released this version
        id: commit
        run: |
          # The newest commit that set the workspace version to exactly the
          # released version (the snap version is "<version>+git<sha>").
          released="${{ steps.stable.outputs.version }}"
          released="${released%%+*}"
          for c in $(git log --format=%H -- Cargo.toml); do
            if git show "$c:Cargo.toml" | grep -qx "version = \"${released}\""; then
              echo "commit=$c" >> "$GITHUB_OUTPUT"
              echo "Release commit: $(git log -1 --format='%h %s' "$c")"
              exit 0
            fi
          done
          echo "::error::No commit set the Cargo.toml version to ${released}"
          exit 1

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          count="$(python3 -c "import json; print(sum(len(v) for v in json.load(open('notices.json')).values()))")"
          open_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label security-rebuild --state open --json number --jq '.[0].number // empty')"
          rebuild=false
          if [[ -n "$open_issue" ]]; then
            echo "Security rebuild issue #$open_issue is still open - not rebuilding again."
          elif [[ "$count" -gt 0 || "$FORCE" == "true" ]]; then
            rebuild=true
          else
            echo "No security notices - nothing to do."
          fi
          if [[ "$DRY_RUN" == "true" && "$rebuild" == "true" ]]; then
            echo "Dry run: would rebuild version ${{ steps.stable.outputs.version }} from ${{ steps.commit.outputs.commit }}."
            rebuild=false
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

      - name: Keep the notices for the next job
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: notices.json

  rebuild:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.upload.outputs.revision }}
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack

      - name: Check the new build
        run: |
          for attempt in 1 2 3; do
            sudo snap install review-tools && break
            [[ "$attempt" == 3 ]] && exit 1
            sleep 30
          done
          review-tools.snap-check-notices "${{ steps.build.outputs.snap }}" | tee rebuilt-notices.json

      - name: Upload to the candidate channel
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          # "candidate", not "latest/candidate" - see call-for-testing.yml.
          output="$(snapcraft upload "${{ steps.build.outputs.snap }}" --release=candidate)"
          echo "$output"
          revision="$(grep -Po 'Revision \K[0-9]+' <<< "$output")"
          [[ -n "$revision" ]] || { echo "Could not parse a revision from 'snapcraft upload'"; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  open-issue:
    needs: [check, rebuild]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download the notices
        uses: actions/download-artifact@v8
        with:
          name: notices

      - name: Open the call for testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          STABLE_REVISION: ${{ needs.check.outputs.stable_revision }}
          REVISION: ${{ needs.rebuild.outputs.revision }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          for label in call-for-testing security-rebuild; do
            gh label create "$label" --repo "$GITHUB_REPOSITORY" --color "B60205" \
              --description "Automated rebuild picking up Ubuntu security fixes" 2>/dev/null || true
          done

          notices="$(python3 - <<'EOF'
          import json
          notices = json.load(open("notices.json"))
          if not notices:
              print("_None - this rebuild was started by hand (force)._")
          for package, usns in sorted(notices.items()):
              links = ", ".join(f"[{u}](https://ubuntu.com/security/notices/{u})" for u in usns)
              print(f"- `{package}`: {links}")
          EOF
          )"

          body=$(cat <<EOF
          A security rebuild of XBTune is ready for testing.

          Ubuntu has published security fixes for packages bundled in the current stable snap (revision ${STABLE_REVISION}). This build is the **same version, ${VERSION}**, rebuilt from its release commit (\`${COMMIT:0:7}\`) so it picks up those fixes. Nothing else in the app has changed.

          ## Fixed notices

          ${notices}

          **Revision:** ${REVISION} · **Channel:** \`latest/candidate\`

          ## How to test

          \`\`\`
          sudo snap refresh ${SNAP_NAME} --channel latest/candidate
          \`\`\`

          Open it and make sure it starts and reads normally.

          ## How to release it

          Comment:

          \`\`\`
          /promote ${REVISION} stable done
          \`\`\`

          That queues \`promote-to-stable.yml\`, which waits for your approval (the \`promote-stable\` environment) and closes this issue once released. Until this issue is closed, the daily check won't rebuild again.

          ---
          _Opened automatically by \`security-rebuild.yml\`._
          EOF
          )

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Security rebuild: v${VERSION} (revision ${REVISION})" \
            --label call-for-testing --label security-rebuild \
            --body "$body"
