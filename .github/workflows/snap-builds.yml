name: 🧪 Snap Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          # Not "args" - the action renamed this input at some point;
          # "args" is silently ignored now (just an unrecognized-input
          # warning, not a hard failure), which meant this was actually
          # running bare `snapcraft` instead of `snapcraft pack` the
          # whole time.
          snapcraft-args: pack

      # The .snap for installing by hand (the bike tests run on a laptop:
      # `sudo snap install --dangerous <file>`). Download it from the run's
      # Summary page; it's zipped, so unzip first. Before the review, so a
      # build the review flags can still be looked at. Nothing goes to the
      # store here.
      - name: Upload Snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.snap }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Snapcraft Review
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'
