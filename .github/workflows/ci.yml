name: 🦀 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libfreetype-dev libfontconfig-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  windows:
    # Phase 10. Linux stays first: this job never gates the snap workflows.
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p xbtune-app -p xbtune-cli

      - name: Package
        shell: pwsh
        run: |
          $dir = "xbtune-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/xbtune.exe, target/release/xbtune-cli.exe, LICENSE, README.md $dir

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: xbtune-windows-x64-${{ github.sha }}
          path: xbtune-windows-x64
          retention-days: 14

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  remote-relay:
    # The remote-tuning Worker under wrangler dev, against the Rust tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libfreetype-dev libfontconfig-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Relay tests
        run: tools/test_remote_relay.sh
