name: 🦀 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libfreetype-dev libfontconfig-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  windows:
    # Phase 10. Linux stays first: this job never gates the snap workflows.
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p xbtune-app -p xbtune-cli

      - name: Package
        shell: pwsh
        run: |
          $dir = "xbtune-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/xbtune.exe, target/release/xbtune-cli.exe, LICENSE, README.md $dir

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: xbtune-windows-x64-${{ github.sha }}
          path: xbtune-windows-x64
          retention-days: 14

  # Every push to main replaces the rolling pre-release `windows-test` with
  # this build, so Windows testers have one link that always has the newest
  # zip (owner, 2026-10-26). Version bumps also get their own v<version>
  # pre-release (windows-release.yml). Never marked latest, so the app's
  # update notice ignores it.
  windows-test-release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-test-release
      cancel-in-progress: true
    steps:
      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: xbtune-windows-x64-${{ github.sha }}
          path: xbtune-windows-x64

      - name: Checkout (for the guide script and fonts)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: src

      - name: Build the guide PDF from the wiki
        # The wiki as a PDF in the zip (owner, 2026-11-02). Never blocks
        # the build: without it the zip ships as before.
        working-directory: src
        env:
          LABEL: ""
        run: |
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core >/dev/null
          # Releases pass their version; test builds say which commit.
          label="${LABEL:-$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml) (test build ${GITHUB_SHA::7})}"
          if tools/make_guide_pdf.sh ../XBTune-Guide.pdf "$label"; then
            echo "guide=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::The guide PDF couldn't be built; the zip ships without it."
          fi

      - name: Replace the windows-test pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Only the tip of main: the tag must sit on a commit with main's
          # workflow files, or GITHUB_TOKEN gets a 403 (windows-release.yml).
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [[ "$tip" != "$SHA" ]]; then
            echo "::notice::${SHA:0:7} is no longer the tip of main (${tip:0:7}); its run will publish."
            exit 0
          fi
          assets=(xbtune-windows-x64.zip)
          if [[ "${guide:-}" == yes ]]; then
            cp XBTune-Guide.pdf xbtune-windows-x64/
            assets+=(XBTune-Guide.pdf)
          fi
          zip -qr xbtune-windows-x64.zip xbtune-windows-x64
          version="$(gh api "repos/${REPO}/contents/Cargo.toml?ref=${SHA}" --jq .content | base64 -d | grep -m1 -oP '^version = "\K[^"]+')"
          subject="$(gh api "repos/${REPO}/commits/${SHA}" --jq '.commit.message | split("\n")[0]')"
          notes=$(cat <<EOF
          **Windows test build: the newest commit on main, not a release.** Rebuilt on every push; this page always has the latest one.

          Built from commit [${SHA:0:7}](https://github.com/${REPO}/commit/${SHA}) (version ${version}): ${subject}

          > ⚠️ **Tuning can damage your engine.** XBTune only reads from the ECM unless you unlock writing in Settings.

          1. Download \`xbtune-windows-x64.zip\` below and unzip it anywhere. Replace the old folder; your files (\`Documents\\XBTune\`) are kept.
          2. Run \`xbtune.exe\`. It isn't code-signed, so Windows may say **"Windows protected your PC"**: **More info → Run anyway**.
          3. \`XBTune-Guide.pdf\` in the folder (also below) is the wiki as one PDF, from the time of this build.

          Pairing, COM ports and where things are: [XBTune on Windows](https://github.com/${REPO}/wiki/Windows). Problems: **Report a problem** in the side bar, or an issue here. [All commits](https://github.com/${REPO}/commits/main).
          EOF
          )
          gh release delete windows-test --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create windows-test "${assets[@]}" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Windows test build (main, ${SHA:0:7})" \
            --prerelease \
            --latest=false \
            --notes "$notes"

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  remote-relay:
    # The remote-tuning Worker under wrangler dev, against the Rust tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libfreetype-dev libfontconfig-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Relay tests
        run: tools/test_remote_relay.sh
