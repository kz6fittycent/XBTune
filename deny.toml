# cargo-deny policy. Allowed licenses are fixed by docs/KICKOFF.md section 2.
[graph]
all-features = true
# Linux first; Windows builds since phase 10 (owner, 2026-10-24), so its
# dependencies are checked too. macOS targets join when that work starts.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Phase 10 (Windows, then macOS).
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) for zbus's helper crates,
# published 2026-10; they come in through eframe's accesskit (screen
# reader support) and zbus. Kept until egui/accesskit move off them.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

# egui's clipboard on Windows (arboard -> clipboard-win -> error-code).
# BSL-1.0 is permissive and GPL-compatible; the owner allowed it for these
# two crates only, 2026-10-24.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
