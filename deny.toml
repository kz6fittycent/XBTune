# cargo-deny policy. Allowed licenses are fixed by docs/KICKOFF.md section 2.
[graph]
all-features = true
# XBTune is Linux-only (KICKOFF section 3); dependencies that exist only for
# other platforms (e.g. clipboard-win) are never built or shipped.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) for zbus's helper crates,
# published 2026-10; they come in through eframe's accesskit (screen
# reader support) and zbus. Kept until egui/accesskit move off them.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via accesskit_unix/zbus, no fix upstream yet" },
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
