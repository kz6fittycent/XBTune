[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
publish = false

[workspace.dependencies]
xbtune-proto = { path = "crates/xbtune-proto" }
xbtune-link = { path = "crates/xbtune-link" }
xbtune-defs = { path = "crates/xbtune-defs" }
xbtune-core = { path = "crates/xbtune-core" }
xbtune-sim = { path = "crates/xbtune-sim" }
xbtune-ai = { path = "crates/xbtune-ai" }
xbtune-remote = { path = "crates/xbtune-remote" }

anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
# Puts the icon into xbtune.exe (build script; Windows targets only).
embed-resource = "3"
# GUI. egui's bundled fonts are off (their licenses fail cargo-deny); the app
# ships Inter (OFL-1.1) itself.
# Files dropped on the window under Wayland (winit 0.30 only handles X11
# drops). Same versions eframe's winit already uses; owner OK'd 2026-10-19.
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
egui = { version = "0.36", default-features = false }
egui_plot = "0.37"
# GNOME Wayland title bar (GNOME doesn't draw server-side frames): winit's
# Adwaita-style client-side frame (sctk-adwaita 0.10, what winit 0.30 uses).
# winit's `wayland-csd-adwaita` renders the title with ab_glyph, which embeds
# Cantarell (OFL-1.1, not allowed in dependencies by KICKOFF section 2), so
# the title uses crossfont instead: system fonts via fontconfig + FreeType.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-crossfont", "rwh_06"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
thiserror = "2"
# Windows COM port names (SetupAPI, registry). Same version serialport uses;
# owner OK'd 2026-10-24.
windows-sys = { version = "0.52", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "fs", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bug reports: one HTTPS POST to the relay (rustls, no OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
# ureq's crypto provider (ureq without its default webpki-roots: CDLA license).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Remote tuning (phase 8, approved 2026-10-15): WebSockets to the relay
# (rustls with the system's CA certificates), SPAKE2 pairing, HKDF-SHA256
# keys, ChaCha20-Poly1305 frames. Versions match spake2 0.4's sha2/hkdf.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
spake2 = { version = "0.4", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
